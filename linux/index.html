<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>Effect Master</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><strong>EFFECT MASTER</strong><button id="pin" title="Keep palette above other windows" aria-label="Keep palette above other windows"></button><button id="settingsButton" title="Settings" aria-label="Settings"></button></header>
<main>
<div class="connections"><button id="vectorConnection">● VectorCraft · Checking…</button><button id="effectConnection">● EffectCraft · Checking…</button></div>
<nav><button id="vectorTab" class="active">VectorCraft</button><button id="effectTab">EffectCraft</button></nav>
<div class="row primary" id="transfers"></div><div class="row modes" id="modes"></div>
<h2>LINKS / COPIES</h2><div class="row" id="links"></div>
<h2 id="contextTitle">ARTBOARD</h2><div class="row" id="context"></div>
<p id="status" role="status">Open both apps. Select artwork, then send.</p>
<footer>0.4.0 · LINUX PREVIEW</footer>
</main>
<dialog id="settingsDialog"><form id="settingsForm">
<h1>Settings</h1>
<label>Accent<select name="accent"><option>Coral</option><option>Lime</option><option>Blue</option><option>Violet</option></select></label>
<label>Button roundness<input name="roundness" type="number" min="0" max="16"></label>
<label>Artboard (0 = active)<input name="artboard" type="number" min="0" max="10000"></label>
<label>New comp FPS<input name="fps" type="number" min="1" max="120"></label>
<label>Duration (seconds)<input name="duration" type="number" min="0.1" max="10800" step="0.1"></label>
<label>VectorCraft port<input name="vectorPort" type="number" min="1024" max="65535"></label>
<label>EffectCraft port<input name="effectPort" type="number" min="1024" max="65535"></label>
<div class="choices"><button type="button" data-choose="vectorPath">Choose VectorCraft…</button><button type="button" data-choose="effectPath">Choose EffectCraft…</button><button type="button" data-choose="assetFolder">Choose image folder…</button><button type="button" id="clearAssets">Use default image folder</button></div>
<p class="hint" id="paths"></p><p class="hint">For the first connection, save and close both apps, then open them using their names in this palette. In EffectCraft, enable “Allow Scripts to Write Files and Access Network.”</p>
<button type="button" id="install">Add to applications menu</button>
<div class="dialogActions"><button type="button" id="cancelSettings">Cancel</button><button type="submit">Save</button></div>
</form></dialog>
<script src="renderer.js"></script></body></html>
